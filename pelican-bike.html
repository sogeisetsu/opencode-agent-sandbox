<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>骑自行车的鹈鹕 · SVG 2D 动画</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#f6faff,#dde6f0)}
  svg{width:min(100vw,1100px);height:auto;display:block}

  /* 车轮 */
  .tire{fill:none;stroke:#2b3440;stroke-width:10}
  .rim{fill:none;stroke:#cfd9e4;stroke-width:4}
  .spokes line{stroke:#aebdcd;stroke-width:2;stroke-linecap:round}
  .hub{fill:#4b586b}

  /* 车架 */
  .frame{fill:none;stroke:#e8503a;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .bars{fill:none;stroke:#2b3440;stroke-width:7;stroke-linecap:round}
  .grip{fill:none;stroke:#2b3440;stroke-width:12;stroke-linecap:round}
  .saddle{fill:#2b3440}
  .chain{fill:none;stroke:#6b7789;stroke-width:3;stroke-dasharray:7 6}
  .crankArm{stroke:#4b586b;stroke-width:7;stroke-linecap:round}
  .cog{fill:none;stroke:#8d99aa;stroke-width:4}

  /* 鹈鹕 */
  .plume{fill:#fdfdfd;stroke:#d7dfe8;stroke-width:2.5}
  .plumeSoft{fill:#f4f7fa;stroke:#d7dfe8;stroke-width:2.5}
  .shade{fill:#edf1f6}
  .beak{fill:#f9b233;stroke:#d9821f;stroke-width:2.5}
  .pouch{fill:#efa020;stroke:#d9821f;stroke-width:2.5}
  .eye{fill:#26313d}
  .glint{fill:#fff}

  /* 腿脚 */
  .leg .bone{stroke:#f9b233;stroke-width:9;stroke-linecap:round}
  .leg--back .bone{stroke:#dd9a20}
  .feather{fill:#fdfdfd;stroke:#d7dfe8;stroke-width:2.2}
  .leg--back .feather{fill:#eef2f7;stroke:#cfd8e3}
  .foot{fill:#f9b233;stroke:#d9821f;stroke-width:2}
  .leg--back .foot{fill:#dd9a20;stroke:#c9821a}
  .leg--back .web{stroke:#c9821a}
  .web{stroke:#d9821f;stroke-width:2;fill:none}
  .pedal{fill:#2b3440}
</style>
</head>
<body>
<svg viewBox="0 0 900 520" role="img" aria-label="一只鹈鹕骑着自行车沿海边公路前进的 2D 动画">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63b8f5"/>
      <stop offset=".6" stop-color="#bfe4ff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".55" stop-color="#ffd166" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b93a3"/>
      <stop offset="1" stop-color="#69718a"/>
    </linearGradient>
    <g id="cloud" fill="#fff" opacity=".93">
      <ellipse cx="0" cy="0" rx="46" ry="26"/>
      <ellipse cx="40" cy="7" rx="34" ry="20"/>
      <ellipse cx="-38" cy="9" rx="30" ry="18"/>
    </g>
    <g id="bush">
      <ellipse cx="0" cy="0" rx="22" ry="12" fill="#6fbf7f"/>
      <ellipse cx="16" cy="4" rx="14" ry="8" fill="#63b273"/>
    </g>
  </defs>

  <!-- ===================== 天空 / 太阳 / 云 ===================== -->
  <rect width="900" height="520" fill="url(#skyGrad)"/>
  <circle cx="762" cy="92" r="96" fill="url(#sunGlow)"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 762 92" to="360 762 92" dur="26s" repeatCount="indefinite"/>
    <path d="M820 92 H840 M803 51 L817 37 M762 34 V14 M721 51 L707 37 M704 92 H684 M721 133 L707 147 M762 150 V170 M803 133 L817 147"
          fill="none" stroke="#ffd166" stroke-width="5" stroke-linecap="round" opacity=".85"/>
  </g>
  <circle cx="762" cy="92" r="46" fill="#ffd166"/>

  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="9s" repeatCount="indefinite"/>
    <use href="#cloud" x="-180" y="74"/>
    <use href="#cloud" x="120" y="108"/>
    <use href="#cloud" x="420" y="58"/>
    <use href="#cloud" x="720" y="122"/>
    <use href="#cloud" x="1020" y="84"/>
    <use href="#cloud" x="1320" y="132"/>
  </g>

  <!-- ===================== 山丘 / 公路 ===================== -->
  <path d="M-20 442 C 60 390 150 394 232 442 Z" fill="#95d8a2"/>
  <path d="M180 442 C 280 376 404 390 508 442 Z" fill="#79cb8c"/>
  <path d="M470 442 C 566 396 686 402 790 442 Z" fill="#95d8a2"/>
  <path d="M720 442 C 800 400 866 402 920 442 Z" fill="#79cb8c"/>
  <use href="#bush" x="150" y="434"/>
  <use href="#bush" x="352" y="430"/>
  <use href="#bush" x="640" y="436"/>
  <use href="#bush" x="866" y="432"/>

  <rect y="442" width="900" height="78" fill="url(#roadGrad)"/>
  <rect y="442" width="900" height="6" fill="#9aa3b2"/>

  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="0.62s" repeatCount="indefinite"/>
    <path d="M-200 482 h80 M-40 482 h80 M120 482 h80 M280 482 h80 M440 482 h80 M600 482 h80 M760 482 h80 M920 482 h80 M1080 482 h80"
          stroke="#f7c948" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".45">
    <line x1="180" y1="466" x2="300" y2="466">
      <animateTransform attributeName="transform" type="translate" from="120 0" to="-420 0" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.45;0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="500" x2="140" y2="500">
      <animateTransform attributeName="transform" type="translate" from="200 0" to="-360 0" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.4;0" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="508" x2="820" y2="508">
      <animateTransform attributeName="transform" type="translate" from="160 0" to="-380 0" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.35;0" dur="1.05s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 地面投影 -->
  <ellipse cx="408" cy="446" rx="215" ry="11" fill="#2b3440" opacity=".14"/>

  <!-- ===================== 后腿（远侧） ===================== -->
  <g id="legBack" class="leg leg--back">
    <g class="thigh">
      <circle class="feather" cx="0" cy="0" r="15"/>
      <line class="bone" x1="0" y1="0" x2="80" y2="0"/>
    </g>
    <g class="shin">
      <line class="bone" x1="0" y1="0" x2="76" y2="0"/>
      <g class="foot" transform="translate(76 0)">
        <rect class="pedal" x="-13" y="7" width="36" height="6" rx="3"/>
        <path class="foot" d="M-10 -6 L16 -6 C27 -6 29 5 16 6 L-10 6 Z"/>
        <path class="web" d="M2 6 L22 3 M0 -3 L24 -3"/>
      </g>
    </g>
  </g>

  <!-- ===================== 自行车 ===================== -->
  <!-- 后轮 -->
  <g>
    <circle class="tire" cx="255" cy="368" r="72"/>
    <circle class="rim" cx="255" cy="368" r="62"/>
    <g class="spokes">
      <animateTransform attributeName="transform" type="rotate" from="0 255 368" to="360 255 368" dur="0.62s" repeatCount="indefinite"/>
      <g transform="rotate(0 255 368)"><line x1="255" y1="310" x2="255" y2="426"/></g>
      <g transform="rotate(45 255 368)"><line x1="255" y1="310" x2="255" y2="426"/></g>
      <g transform="rotate(90 255 368)"><line x1="255" y1="310" x2="255" y2="426"/></g>
      <g transform="rotate(135 255 368)"><line x1="255" y1="310" x2="255" y2="426"/></g>
    </g>
    <circle class="hub" cx="255" cy="368" r="7"/>
  </g>

  <!-- 后侧曲柄 -->
  <line id="crankBack" class="crankArm" x1="395" y1="362" x2="395" y2="388"/>

  <!-- 车架 -->
  <g class="frame">
    <path d="M255 368 L395 362"/>
    <path d="M255 368 L332 256"/>
    <path d="M395 362 L332 256"/>
    <path d="M395 362 L552 254"/>
    <path d="M332 256 L552 254"/>
    <path d="M552 254 C 558 292 564 332 565 368"/>
  </g>
  <!-- 传动 -->
  <path class="chain" d="M393 350 L253 362 M397 374 L257 386"/>
  <circle class="cog" cx="255" cy="368" r="8"/>
  <circle class="cog" cx="395" cy="362" r="13"/>

  <!-- 前侧曲柄 -->
  <line id="crankFront" class="crankArm" x1="395" y1="362" x2="395" y2="388"/>

  <!-- 前轮 -->
  <g>
    <circle class="tire" cx="565" cy="368" r="72"/>
    <circle class="rim" cx="565" cy="368" r="62"/>
    <g class="spokes">
      <animateTransform attributeName="transform" type="rotate" from="0 565 368" to="360 565 368" dur="0.62s" repeatCount="indefinite"/>
      <g transform="rotate(0 565 368)"><line x1="565" y1="310" x2="565" y2="426"/></g>
      <g transform="rotate(45 565 368)"><line x1="565" y1="310" x2="565" y2="426"/></g>
      <g transform="rotate(90 565 368)"><line x1="565" y1="310" x2="565" y2="426"/></g>
      <g transform="rotate(135 565 368)"><line x1="565" y1="310" x2="565" y2="426"/></g>
    </g>
    <circle class="hub" cx="565" cy="368" r="7"/>
  </g>

  <!-- 车把 / 车座 -->
  <path class="bars" d="M552 256 C 551 242 557 234 570 236 L 604 242"/>
  <line class="grip" x1="586" y1="241" x2="610" y2="244"/>
  <ellipse class="saddle" cx="332" cy="248" rx="30" ry="8" transform="rotate(-8 332 248)"/>

  <!-- ===================== 鹈鹕 ===================== -->
  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2.5;0 0" dur="0.575s"
                      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <path class="plumeSoft" d="M302 168 C 262 156 234 146 214 146 C 236 176 264 196 292 200 Z"/>
    <!-- 远侧翅膀（扇动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-12 375 150; 9 375 150; -12 375 150" dur="0.72s"
                        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
      <path class="plumeSoft" d="M374 148 C 352 112 342 74 350 52 C 376 66 394 110 394 148 Z"/>
      <path d="M368 132 C 360 106 356 82 356 62" fill="none" stroke="#d7dfe8" stroke-width="2"/>
    </g>
    <!-- 身体 -->
    <ellipse class="plume" cx="358" cy="178" rx="80" ry="62" transform="rotate(-10 358 178)"/>
    <ellipse class="shade" cx="366" cy="204" rx="56" ry="30" transform="rotate(-8 366 204)"/>
    <!-- 脖子 -->
    <path d="M396 152 C 424 126 444 110 468 102" fill="none" stroke="#fdfdfd" stroke-width="36" stroke-linecap="round"/>
    <path d="M396 152 C 424 126 444 110 468 102" fill="none" stroke="#d7dfe8" stroke-width="40" stroke-linecap="round" opacity=".18"/>
    <path d="M396 152 C 424 126 444 110 468 102" fill="none" stroke="#fdfdfd" stroke-width="34" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse class="plume" cx="486" cy="98" rx="32" ry="28"/>
    <!-- 喙 -->
    <path class="beak" d="M506 82 C 560 90 618 108 652 124 L 650 132 C 612 118 556 104 504 102 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 540 106; 2 540 106; -2 540 106" dur="0.85s"
                        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
      <path class="pouch" d="M504 102 C 560 110 618 122 651 131 C 630 158 570 166 520 146 C 500 136 496 116 504 102 Z"/>
      <path d="M512 108 C 556 118 606 128 646 133" fill="none" stroke="#d9821f" stroke-width="2" opacity=".7"/>
    </g>
    <!-- 眼 -->
    <circle class="eye" cx="494" cy="86" r="5"/>
    <circle class="glint" cx="496" cy="84" r="1.8"/>
  </g>

  <!-- 近侧翅膀（扶着车把） -->
  <path class="plumeSoft" d="M392 176 C 452 186 540 216 598 234 L 602 246 C 542 232 452 206 388 200 Z"/>
  <path d="M470 196 C 520 210 566 226 596 238" fill="none" stroke="#dfe6ee" stroke-width="2"/>
  <circle class="plume" cx="602" cy="242" r="11"/>
  <path class="plume" d="M606 248 C 616 252 618 260 612 264 Q 604 258 600 250 Z"/>

  <!-- ===================== 前腿（近侧） ===================== -->
  <g id="legFront" class="leg">
    <g class="thigh">
      <circle class="feather" cx="0" cy="0" r="16"/>
      <line class="bone" x1="0" y1="0" x2="80" y2="0"/>
    </g>
    <g class="shin">
      <line class="bone" x1="0" y1="0" x2="76" y2="0"/>
      <g class="foot" transform="translate(76 0)">
        <rect class="pedal" x="-13" y="7" width="36" height="6" rx="3"/>
        <path class="foot" d="M-10 -6 L16 -6 C27 -6 29 5 16 6 L-10 6 Z"/>
        <path class="web" d="M2 6 L22 3 M0 -3 L24 -3"/>
      </g>
    </g>
  </g>

  <!-- 尘土 -->
  <g fill="#ffffff" opacity=".7">
    <circle cx="200" cy="430" r="7">
      <animate attributeName="cx" values="215;150" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="430;412" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;14" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".75;0" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="436" r="6">
      <animate attributeName="cx" values="200;120" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="436;418" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;12" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

<script>
(function () {
  // 髋关节 / 五通（曲柄中心）与大小腿长度，决定踩踏的逆运动学
  var HIP = { x: 335, y: 248 };
  var CRANK = { x: 395, y: 362 };
  var R = 26;      // 曲柄半径
  var L1 = 80;     // 大腿
  var L2 = 76;     // 小腿
  var PERIOD = 1.15; // 一圈踩踏的秒数

  var DEG = 180 / Math.PI;

  var parts = [
    { phase: 0,          legId: 'legFront', crankId: 'crankFront' },
    { phase: Math.PI,    legId: 'legBack',  crankId: 'crankBack'  }
  ].map(function (p) {
    var root = document.getElementById(p.legId);
    return {
      phase: p.phase,
      thigh: root.querySelector('.thigh'),
      shin: root.querySelector('.shin'),
      foot: root.querySelector('.foot'),
      crank: document.getElementById(p.crankId)
    };
  });

  // 两段式逆运动学：已知髋、脚（脚踏）位置，求大腿、小腿角度
  function solve(phase) {
    var px = CRANK.x + R * Math.cos(phase);
    var py = CRANK.y + R * Math.sin(phase);
    var dx = px - HIP.x, dy = py - HIP.y;
    var d = Math.hypot(dx, dy);
    var maxD = L1 + L2 - 0.5;
    if (d > maxD) { d = maxD; }
    var theta = Math.atan2(dy, dx);
    var cosA = (d * d + L1 * L1 - L2 * L2) / (2 * d * L1);
    cosA = Math.min(1, Math.max(-1, cosA));
    var a1 = theta - Math.acos(cosA);          // 膝盖朝前弯
    var kx = HIP.x + L1 * Math.cos(a1);
    var ky = HIP.y + L1 * Math.sin(a1);
    var a2 = Math.atan2(py - ky, px - kx);
    return { px: px, py: py, a1: a1, a2: a2 };
  }

  var start = null;

  function frame(t) {
    if (start === null) { start = t; }
    var phase = ((t - start) / 1000) / PERIOD * Math.PI * 2;

    parts.forEach(function (p) {
      var s = solve(phase + p.phase);
      var d1 = s.a1 * DEG, d2 = s.a2 * DEG;

      p.thigh.setAttribute('transform',
        'translate(' + HIP.x + ' ' + HIP.y + ') rotate(' + d1.toFixed(2) + ')');
      p.shin.setAttribute('transform',
        'translate(' + HIP.x + ' ' + HIP.y + ') rotate(' + d1.toFixed(2) +
        ') translate(' + L1 + ' 0) rotate(' + (d2 - d1).toFixed(2) + ')');
      p.foot.setAttribute('transform',
        'translate(' + L2 + ' 0) rotate(' + (-d2).toFixed(2) + ')');
      p.crank.setAttribute('x2', s.px.toFixed(2));
      p.crank.setAttribute('y2', s.py.toFixed(2));
    });

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
