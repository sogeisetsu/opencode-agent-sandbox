<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>鹈鹕骑行 · HungerG Free</title>
  <style>
    :root {
      --ink: #173f46;
      --muted: #5f7c7e;
      --paper: #f7f3e9;
      --teal: #116b73;
      --coral: #e77d56;
      --line: rgba(23, 63, 70, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.95), transparent 34rem),
        radial-gradient(circle at 90% 90%, rgba(221,235,222,.75), transparent 32rem),
        #eee9dd;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(1180px, 100%);
      padding: clamp(16px, 3vw, 38px);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin: 0 4px 18px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--teal);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 3.5vw, 43px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }

    .subtitle {
      max-width: 350px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
      text-align: right;
    }

    .stage {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 26px;
      background: #b9dfe3;
      box-shadow:
        0 30px 70px -35px rgba(25, 62, 64, .48),
        0 3px 10px rgba(25, 62, 64, .08);
      isolation: isolate;
    }

    svg.scene {
      display: block;
      width: 100%;
      height: auto;
    }

    .route-tag {
      position: absolute;
      top: 20px;
      left: 22px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.52);
      border-radius: 999px;
      color: #235861;
      background: rgba(248, 246, 232, .58);
      backdrop-filter: blur(8px);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
    }

    .route-tag::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 0 0 4px rgba(231,125,86,.15);
      content: "";
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.48);
    }

    button {
      min-width: 88px;
      padding: 10px 15px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: var(--teal);
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    button:hover { background: #0c5961; }
    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(231,125,86,.48); outline-offset: 3px; }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    input[type="range"] {
      width: clamp(100px, 22vw, 230px);
      accent-color: var(--coral);
      cursor: pointer;
    }

    output {
      min-width: 42px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .hint {
      margin: 0 0 0 auto;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      text-align: right;
    }

    @media (max-width: 720px) {
      header { display: block; }
      .subtitle { margin-top: 10px; text-align: left; }
      .stage { border-radius: 18px; }
      .route-tag { top: 12px; left: 12px; padding: 6px 9px; font-size: 8px; }
      .controls { flex-wrap: wrap; }
      .hint { width: 100%; margin-left: 0; text-align: left; }
    }
  </style>
</head>

    </section>

    <div class="controls" aria-label="动画控制">
      <button id="toggleBtn" type="button" aria-pressed="false">暂停</button>
      <label class="speed-control" for="speedRange">
        <span>速度</span>
        <input id="speedRange" type="range" min="0.25" max="2" step="0.25" value="1">
        <output id="speedValue" for="speedRange">1.00×</output>
      </label>
      <p class="hint">纯 SVG + 单时钟 rAF 循环<br>无外部图片、字体或运行时依赖</p>
    </div>
  </main>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const rearSpokes = $('rearSpokes');
      const frontSpokes = $('frontSpokes');
      const chainring = $('chainring');
      const crankA = $('crankA');
      const crankB = $('crankB');
      const pedalA = $('pedalA');
      const pedalB = $('pedalB');
      const riderBody = $('riderBody');
      const roadMarks = $('roadMarks');
      const clouds = $('clouds');
      const waterLines = $('waterLines');
      const grassLeft = $('grassLeft');
      const grassRight = $('grassRight');
      const toggleBtn = $('toggleBtn');
      const speedRange = $('speedRange');
      const speedValue = $('speedValue');

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1;
      let sceneTime = 0;
      let previous = performance.now();

      const crank = { x: 615, y: 525 };
      const radius = 34;

      function setLeg(legPath, highlightPath, footPath, hip, pedal, bend) {
        const thigh = 104;
        const shin = 112;
        const dx = pedal.x - hip.x;
        const dy = pedal.y - hip.y;
        const distance = Math.max(1, Math.min(Math.hypot(dx, dy), thigh + shin - 0.01));
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const ux = dx / distance;
        const uy = dy / distance;
        const knee = {
          x: hip.x + along * ux + bend * height * -uy,
          y: hip.y + along * uy + bend * height * ux
        };
        const d = `M${hip.x.toFixed(2)} ${hip.y.toFixed(2)}L${knee.x.toFixed(2)} ${knee.y.toFixed(2)}L${pedal.x.toFixed(2)} ${pedal.y.toFixed(2)}`;
        legPath.setAttribute('d', d);
        if (highlightPath) highlightPath.setAttribute('d', d);
        footPath.setAttribute('d',
          `M${(pedal.x - 12).toFixed(2)} ${(pedal.y - 3).toFixed(2)}` +
          `q17-15 40-8l14 10q-30 9-54 4Z`
        );
      }

      function render() {
        const wheelDegrees = sceneTime * 190;
        const crankDegrees = sceneTime * 96;
        const theta = crankDegrees * Math.PI / 180;
        const pedal1 = {
          x: crank.x + Math.cos(theta) * radius,
          y: crank.y + Math.sin(theta) * radius
        };
        const pedal2 = {
          x: crank.x - Math.cos(theta) * radius,
          y: crank.y - Math.sin(theta) * radius
        };
        const bob = Math.sin(sceneTime * Math.PI * 2 * 1.15) * 2.2;

        rearSpokes.setAttribute('transform', `rotate(${wheelDegrees.toFixed(2)})`);
        frontSpokes.setAttribute('transform', `rotate(${wheelDegrees.toFixed(2)})`);
        chainring.setAttribute('transform', `rotate(${crankDegrees.toFixed(2)} 615 525)`);

        crankA.setAttribute('x2', pedal1.x.toFixed(2));
        crankA.setAttribute('y2', pedal1.y.toFixed(2));
        crankB.setAttribute('x2', pedal2.x.toFixed(2));
        crankB.setAttribute('y2', pedal2.y.toFixed(2));
        pedalA.setAttribute('transform', `translate(${pedal1.x.toFixed(2)} ${pedal1.y.toFixed(2)})`);
        pedalB.setAttribute('transform', `translate(${pedal2.x.toFixed(2)} ${pedal2.y.toFixed(2)})`);

        riderBody.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
        setLeg($('farLegPath'), null, $('farFoot'), { x: 568, y: 352 + bob }, pedal2, -1);
        setLeg($('nearLegPath'), $('nearLegHighlight'), $('nearFoot'), { x: 604, y: 355 + bob }, pedal1, 1);

        roadMarks.setAttribute('transform', `translate(${(-(sceneTime * 210 % 260)).toFixed(2)} 0)`);
        clouds.setAttribute('transform', `translate(${(-(sceneTime * 7 % 1200)).toFixed(2)} 0)`);
        waterLines.setAttribute('stroke-dashoffset', (-sceneTime * 24).toFixed(2));
        grassLeft.setAttribute('transform', `rotate(${(Math.sin(sceneTime * 2.3) * 1.3).toFixed(2)} 55 700)`);
        grassRight.setAttribute('transform', `rotate(${(Math.sin(sceneTime * 2.1 + 1.7) * 1.1).toFixed(2)} 1140 700)`);
      }

      function syncButton() {
        toggleBtn.textContent = playing ? '暂停' : '继续';
        toggleBtn.setAttribute('aria-pressed', String(!playing));
      }

      function tick(now) {
        const delta = Math.min((now - previous) / 1000, 0.05);
        previous = now;
        if (playing) {
          sceneTime += delta * speed;
          render();
        }
        requestAnimationFrame(tick);
      }

      toggleBtn.addEventListener('click', () => {
        playing = !playing;
        previous = performance.now();
        syncButton();
      });

      speedRange.addEventListener('input', () => {
        speed = Number(speedRange.value);
        speedValue.value = `${speed.toFixed(2)}×`;
        render();
      });

      reducedMotion.addEventListener('change', event => {
        if (event.matches && playing) {
          playing = false;
          syncButton();
        }
      });

      syncButton();
      render();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
