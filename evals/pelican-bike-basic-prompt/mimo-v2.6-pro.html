<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Riding a Bicycle</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef2f6;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #1f2937;
  }
  main {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(31, 41, 55, 0.12);
    padding: 28px 32px 22px;
    max-width: 92vw;
  }
  h1 {
    margin: 0 0 14px;
    font-size: 1.25rem;
    font-weight: 650;
    letter-spacing: 0.01em;
    text-align: center;
  }
  svg {
    display: block;
    width: min(800px, 86vw);
    height: auto;
    border-radius: 10px;
  }
  figcaption {
    margin-top: 12px;
    text-align: center;
    font-size: 0.82rem;
    color: #6b7280;
  }
</style>
</head>
<body>
<main>
  <h1>Pelican Riding a Bicycle</h1>
  <figure style="margin:0">
    <svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="A cartoon pelican with a large orange beak riding a blue bicycle">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eaf3fa"/>
          <stop offset="1" stop-color="#f8fbfd"/>
        </linearGradient>
      </defs>

      <!-- background -->
      <rect width="800" height="560" fill="url(#sky)"/>

      <!-- ground -->
      <line x1="60" y1="502" x2="740" y2="502" stroke="#c3d2db" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="250" cy="512" rx="95" ry="11" fill="#d5e1e8" opacity="0.8"/>
      <ellipse cx="570" cy="512" rx="95" ry="11" fill="#d5e1e8" opacity="0.8"/>

      <!-- rear wheel -->
      <g>
        <circle cx="250" cy="420" r="80" fill="none" stroke="#37424c" stroke-width="11"/>
        <circle cx="250" cy="420" r="70" fill="none" stroke="#93a3ae" stroke-width="4"/>
        <g stroke="#b3c1cb" stroke-width="2.5" stroke-linecap="round">
          <line x1="250" y1="420" x2="320" y2="420"/>
          <line x1="250" y1="420" x2="299.5" y2="370.5"/>
          <line x1="250" y1="420" x2="250" y2="350"/>
          <line x1="250" y1="420" x2="200.5" y2="370.5"/>
          <line x1="250" y1="420" x2="180" y2="420"/>
          <line x1="250" y1="420" x2="200.5" y2="469.5"/>
          <line x1="250" y1="420" x2="250" y2="490"/>
          <line x1="250" y1="420" x2="299.5" y2="469.5"/>
        </g>
        <circle cx="250" cy="420" r="8" fill="#6b7883"/>
      </g>

      <!-- frame -->
      <g fill="none" stroke="#2b6e8f" stroke-width="10" stroke-linecap="round">
        <path d="M 395 438 L 355 285"/>          <!-- seat tube -->
        <path d="M 395 438 L 548 335"/>          <!-- down tube -->
        <path d="M 357 292 L 535 292"/>          <!-- top tube -->
        <path d="M 395 438 L 250 420"/>          <!-- chain stay -->
        <path d="M 357 295 L 250 420"/>          <!-- seat stay -->
        <path d="M 533 285 L 550 345"/>          <!-- head tube -->
        <path d="M 550 345 Q 562 382 570 420"/>  <!-- fork -->
      </g>

      <!-- chainring, cog, chain -->
      <g fill="none" stroke="#7c8a94" stroke-width="5" stroke-linecap="round">
        <circle cx="395" cy="438" r="26"/>
        <circle cx="250" cy="420" r="12"/>
        <path d="M 395 412 L 250 408"/>
        <path d="M 395 464 L 250 432"/>
      </g>
      <circle cx="395" cy="438" r="8" fill="#5c6a74"/>

      <!-- cranks + pedals -->
      <g stroke="#55616b" stroke-width="9" stroke-linecap="round">
        <line x1="395" y1="438" x2="430" y2="475"/>
        <line x1="395" y1="438" x2="360" y2="401"/>
      </g>
      <rect x="415" y="470" width="32" height="10" rx="5" fill="#3c464e"/>
      <rect x="345" y="396" width="32" height="10" rx="5" fill="#3c464e"/>

      <!-- saddle -->
      <path d="M 322 280 C 335 271, 372 271, 383 278 C 389 285, 371 293, 349 293 C 329 293, 317 288, 322 280 Z"
            fill="#3c464e"/>

      <!-- handlebar -->
      <g fill="none" stroke="#3c464e" stroke-width="9" stroke-linecap="round">
        <path d="M 533 285 L 528 260"/>
        <path d="M 528 260 C 545 248, 568 243, 588 250"/>
      </g>
      <line x1="576" y1="247" x2="598" y2="254" stroke="#20272d" stroke-width="11" stroke-linecap="round"/>

      <!-- front wheel -->
      <g>
        <circle cx="570" cy="420" r="80" fill="none" stroke="#37424c" stroke-width="11"/>
        <circle cx="570" cy="420" r="70" fill="none" stroke="#93a3ae" stroke-width="4"/>
        <g stroke="#b3c1cb" stroke-width="2.5" stroke-linecap="round">
          <line x1="570" y1="420" x2="640" y2="420"/>
          <line x1="570" y1="420" x2="619.5" y2="370.5"/>
          <line x1="570" y1="420" x2="570" y2="350"/>
          <line x1="570" y1="420" x2="520.5" y2="370.5"/>
          <line x1="570" y1="420" x2="500" y2="420"/>
          <line x1="570" y1="420" x2="520.5" y2="469.5"/>
          <line x1="570" y1="420" x2="570" y2="490"/>
          <line x1="570" y1="420" x2="619.5" y2="469.5"/>
        </g>
        <circle cx="570" cy="420" r="8" fill="#6b7883"/>
      </g>

      <!-- ================= pelican ================= -->

      <!-- tail -->
      <path d="M 288 248 L 212 210 L 278 278 Z" fill="#efe9da" stroke="#d5cdb8" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 270 250 L 226 224" stroke="#d9d1bc" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 268 262 L 232 240" stroke="#d9d1bc" stroke-width="2.5" stroke-linecap="round"/>

      <!-- body -->
      <ellipse cx="360" cy="265" rx="88" ry="58" transform="rotate(-10 360 265)"
               fill="#fdfaf2" stroke="#d8d0ba" stroke-width="3.5"/>

      <!-- folded wing -->
      <path d="M 318 242 C 355 228, 396 246, 400 282 C 373 304, 330 302, 311 278 C 303 264, 306 250, 318 242 Z"
            fill="#f2ecd9" stroke="#d5cdb6" stroke-width="3"/>
      <path d="M 330 252 C 352 246, 376 252, 388 268" fill="none" stroke="#d5cdb6" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 326 268 C 350 262, 374 268, 388 282" fill="none" stroke="#d5cdb6" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 328 284 C 350 280, 370 284, 384 294" fill="none" stroke="#d5cdb6" stroke-width="2.5" stroke-linecap="round"/>

      <!-- neck -->
      <path d="M 408 238 C 452 216, 486 196, 506 178" fill="none" stroke="#ddd5c0" stroke-width="42" stroke-linecap="round"/>
      <path d="M 408 238 C 452 216, 486 196, 506 178" fill="none" stroke="#fdfaf2" stroke-width="35" stroke-linecap="round"/>

      <!-- head -->
      <circle cx="518" cy="168" r="31" fill="#fdfaf2" stroke="#d8d0ba" stroke-width="3.5"/>

      <!-- beak + pouch -->
      <path d="M 540 150 C 592 157, 646 174, 690 193 L 683 208 C 640 191, 588 177, 537 173 Z"
            fill="#f2a54e" stroke="#d98b2d" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 538 173 Q 612 238 683 208 Q 610 216 538 173 Z"
            fill="#f7bd72" stroke="#e5a14c" stroke-width="3" stroke-linejoin="round"/>

      <!-- eye -->
      <circle cx="525" cy="156" r="7" fill="#2b2b2b"/>
      <circle cx="527.5" cy="153.5" r="2.5" fill="#ffffff"/>

      <!-- extended wing gripping the bar -->
      <path d="M 424 250 C 470 230, 532 226, 578 239 C 588 242, 590 253, 580 259 C 534 270, 470 277, 428 273 Z"
            fill="#f7f2e4" stroke="#d8d0ba" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 556 246 C 566 246, 574 248, 580 252" fill="none" stroke="#d5cdb6" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 552 256 C 562 258, 570 259, 578 259" fill="none" stroke="#d5cdb6" stroke-width="2.5" stroke-linecap="round"/>

      <!-- legs -->
      <g fill="none" stroke="#ef9a3d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 398 315 L 421 396 L 428 466"/>
        <path d="M 375 318 L 368 370 L 361 393"/>
      </g>
      <!-- webbed feet -->
      <path d="M 413 467 L 445 467 L 429 483 Z" fill="#ef9a3d" stroke="#d98b2d" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 347 392 L 377 392 L 361 407 Z" fill="#ef9a3d" stroke="#d98b2d" stroke-width="2" stroke-linejoin="round"/>

      <!-- chest shading -->
      <path d="M 352 300 C 372 312, 396 312, 412 302" fill="none" stroke="#e8e0ca" stroke-width="3" stroke-linecap="round"/>
      <path d="M 336 312 C 356 324, 384 324, 402 314" fill="none" stroke="#e8e0ca" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <figcaption>SVG · pelican on a bicycle</figcaption>
  </figure>
</main>
</body>
</html>
