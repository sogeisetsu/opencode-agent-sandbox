<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Riding a Bicycle</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef2f6;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #1f2937;
  }
  main {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(31, 41, 55, 0.12);
    padding: 28px 32px 22px;
    max-width: 92vw;
  }
  h1 {
    margin: 0 0 14px;
    font-size: 1.25rem;
    font-weight: 650;
    letter-spacing: 0.01em;
    text-align: center;
  }
  svg {
    display: block;
    width: min(800px, 86vw);
    height: auto;
    border-radius: 10px;
  }
  figcaption {
    margin-top: 12px;
    text-align: center;
    font-size: 0.82rem;
    color: #6b7280;
  }
</style>
</head>
<body>
<main>
  <h1>Pelican Riding a Bicycle</h1>
  <figure style="margin:0">
    <svg id="scene" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="An animated cartoon pelican riding a bicycle along a road">
      <desc id="dsc">The pelican pedals a bicycle along a road. Wheels, cranks, legs and road
        markings are driven by one shared clock; clouds drift slower in the distance.</desc>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eaf3fa"/>
          <stop offset="1" stop-color="#f8fbfd"/>
        </linearGradient>
      </defs>

      <!-- background -->
      <rect width="800" height="560" fill="url(#sky)"/>
      <circle cx="702" cy="86" r="30" fill="#f6c453" opacity="0.9"/>
      <circle cx="702" cy="86" r="46" fill="#f6c453" opacity="0.22"/>

      <!-- clouds: identical, uniform spacing 420 == wrap modulus (seamless) -->
      <g id="clouds" fill="#ffffff" opacity="0.9">
        <g transform="translate(-520 0)"><ellipse cx="0" cy="110" rx="46" ry="17"/><ellipse cx="-26" cy="102" rx="26" ry="14"/><ellipse cx="22" cy="100" rx="30" ry="16"/></g>
        <g transform="translate(-100 0)"><ellipse cx="0" cy="110" rx="46" ry="17"/><ellipse cx="-26" cy="102" rx="26" ry="14"/><ellipse cx="22" cy="100" rx="30" ry="16"/></g>
        <g transform="translate(320 0)"><ellipse cx="0" cy="110" rx="46" ry="17"/><ellipse cx="-26" cy="102" rx="26" ry="14"/><ellipse cx="22" cy="100" rx="30" ry="16"/></g>
        <g transform="translate(740 0)"><ellipse cx="0" cy="110" rx="46" ry="17"/><ellipse cx="-26" cy="102" rx="26" ry="14"/><ellipse cx="22" cy="100" rx="30" ry="16"/></g>
        <g transform="translate(1160 0)"><ellipse cx="0" cy="110" rx="46" ry="17"/><ellipse cx="-26" cy="102" rx="26" ry="14"/><ellipse cx="22" cy="100" rx="30" ry="16"/></g>
      </g>

      <!-- road: top edge y=505.5 == wheel outer bottom (hub 420 + 85.5) -->
      <rect x="0" y="505.5" width="800" height="20" fill="#c3d2db"/>
      <!-- road dashes: spacing TILE=134.303 == wrap modulus (seamless) -->
      <g id="road" fill="#eef4f8">
        <rect x="-270" y="510" width="56" height="5" rx="2.5"/>
        <rect x="-135.697" y="510" width="56" height="5" rx="2.5"/>
        <rect x="-1.394" y="510" width="56" height="5" rx="2.5"/>
        <rect x="132.909" y="510" width="56" height="5" rx="2.5"/>
        <rect x="267.212" y="510" width="56" height="5" rx="2.5"/>
        <rect x="401.515" y="510" width="56" height="5" rx="2.5"/>
        <rect x="535.818" y="510" width="56" height="5" rx="2.5"/>
        <rect x="670.121" y="510" width="56" height="5" rx="2.5"/>
        <rect x="804.424" y="510" width="56" height="5" rx="2.5"/>
        <rect x="938.727" y="510" width="56" height="5" rx="2.5"/>
      </g>

      <!-- shadows -->
      <ellipse cx="250" cy="512" rx="95" ry="10" fill="#a9bcc7" opacity="0.45"/>
      <ellipse cx="570" cy="512" rx="95" ry="10" fill="#a9bcc7" opacity="0.45"/>

      <!-- rear wheel -->
      <g>
        <circle cx="250" cy="420" r="80" fill="none" stroke="#37424c" stroke-width="11"/>
        <circle cx="250" cy="420" r="70" fill="none" stroke="#93a3ae" stroke-width="4"/>
        <g id="spokesR">
          <g stroke="#b3c1cb" stroke-width="2.5" stroke-linecap="round">
            <line x1="250" y1="420" x2="320" y2="420"/>
            <line x1="250" y1="420" x2="299.5" y2="370.5"/>
            <line x1="250" y1="420" x2="250" y2="350"/>
            <line x1="250" y1="420" x2="200.5" y2="370.5"/>
            <line x1="250" y1="420" x2="180" y2="420"/>
            <line x1="250" y1="420" x2="200.5" y2="469.5"/>
            <line x1="250" y1="420" x2="250" y2="490"/>
            <line x1="250" y1="420" x2="299.5" y2="469.5"/>
          </g>
          <rect x="246" y="330" width="8" height="16" rx="3" fill="#e8963c"/>
        </g>
        <circle cx="250" cy="420" r="8" fill="#6b7883"/>
      </g>

      <!-- front wheel -->
      <g>
        <circle cx="570" cy="420" r="80" fill="none" stroke="#37424c" stroke-width="11"/>
        <circle cx="570" cy="420" r="70" fill="none" stroke="#93a3ae" stroke-width="4"/>
        <g id="spokesF">
          <g stroke="#b3c1cb" stroke-width="2.5" stroke-linecap="round">
            <line x1="570" y1="420" x2="640" y2="420"/>
            <line x1="570" y1="420" x2="619.5" y2="370.5"/>
            <line x1="570" y1="420" x2="570" y2="350"/>
            <line x1="570" y1="420" x2="520.5" y2="370.5"/>
            <line x1="570" y1="420" x2="500" y2="420"/>
            <line x1="570" y1="420" x2="520.5" y2="469.5"/>
            <line x1="570" y1="420" x2="570" y2="490"/>
            <line x1="570" y1="420" x2="619.5" y2="469.5"/>
          </g>
          <rect x="566" y="330" width="8" height="16" rx="3" fill="#e8963c"/>
        </g>
        <circle cx="570" cy="420" r="8" fill="#6b7883"/>
      </g>

      <!-- frame -->
      <g fill="none" stroke="#2b6e8f" stroke-width="10" stroke-linecap="round">
        <path d="M 395 438 L 355 285"/>
        <path d="M 395 438 L 548 335"/>
        <path d="M 357 292 L 535 292"/>
        <path d="M 395 438 L 250 420"/>
        <path d="M 357 295 L 250 420"/>
        <path d="M 533 285 L 550 345"/>
        <path d="M 550 345 Q 562 382 570 420"/>
      </g>

      <!-- saddle -->
      <path d="M 322 280 C 335 271, 372 271, 383 278 C 389 285, 371 293, 349 293 C 329 293, 317 288, 322 280 Z"
            fill="#3c464e"/>

      <!-- handlebar -->
      <g fill="none" stroke="#3c464e" stroke-width="9" stroke-linecap="round">
        <path d="M 533 285 L 528 260"/>
        <path d="M 528 260 C 545 248, 568 243, 588 250"/>
      </g>
      <line x1="576" y1="247" x2="598" y2="254" stroke="#20272d" stroke-width="11" stroke-linecap="round"/>

      <!-- chain (dashes scroll at chain speed = ring 26 * omega_crank = cog 13 * omega_wheel) -->
      <g stroke="#8b969e" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7">
        <path id="chainA" d="M 395 412 L 250 408"/>
        <path id="chainB" d="M 395 464 L 250 432"/>
      </g>

      <!-- crank group: rotates about BB (395,438); pedals counter-rotate to stay level -->
      <g id="crank">
        <g stroke="#55616b" stroke-width="9" stroke-linecap="round">
          <line x1="395" y1="438" x2="430" y2="475"/>
          <line x1="395" y1="438" x2="360" y2="401"/>
        </g>
        <circle cx="395" cy="438" r="26" fill="none" stroke="#7c8a94" stroke-width="5"/>
        <circle cx="395" cy="438" r="8" fill="#5c6a74"/>
        <g id="pedalA"><rect x="414" y="470" width="32" height="10" rx="5" fill="#3c464e"/></g>
        <g id="pedalB"><rect x="344" y="396" width="32" height="10" rx="5" fill="#3c464e"/></g>
      </g>

      <!-- legs: two-bone IK, same knee fold (forward) for both; feet pinned to pedals -->
      <path id="legB" d="M 348 324 L 435.28 361.52 L 360 401" fill="none" stroke="#c97f2e"
            stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
      <path id="legA" d="M 400 314 L 452.61 392.96 L 430 475" fill="none" stroke="#ef9a3d"
            stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- ================= pelican (bobs as it pedals) ================= -->
      <g id="pelican">

        <!-- tail -->
        <path d="M 288 248 L 212 210 L 278 278 Z" fill="#efe9da" stroke="#d5cdb8" stroke-width="3" stroke-linejoin="round"/>
        <path d="M 270 250 L 226 224" stroke="#d9d1bc" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 268 262 L 232 240" stroke="#d9d1bc" stroke-width="2.5" stroke-linecap="round"/>

        <!-- body -->
        <ellipse cx="360" cy="265" rx="88" ry="58" transform="rotate(-10 360 265)"
                 fill="#fdfaf2" stroke="#d8d0ba" stroke-width="3.5"/>

        <!-- folded wing -->
        <path d="M 318 242 C 355 228, 396 246, 400 282 C 373 304, 330 302, 311 278 C 303 264, 306 250, 318 242 Z"
              fill="#f2ecd9" stroke="#d5cdb6" stroke-width="3"/>
        <path d="M 330 252 C 352 246, 376 252, 388 268" fill="none" stroke="#d5cdb6" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 326 268 C 350 262, 374 268, 388 282" fill="none" stroke="#d5cdb6" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 328 284 C 350 280, 370 284, 384 294" fill="none" stroke="#d5cdb6" stroke-width="2.5" stroke-linecap="round"/>

        <!-- neck -->
        <path d="M 408 238 C 452 216, 486 196, 506 178" fill="none" stroke="#ddd5c0" stroke-width="42" stroke-linecap="round"/>
        <path d="M 408 238 C 452 216, 486 196, 506 178" fill="none" stroke="#fdfaf2" stroke-width="35" stroke-linecap="round"/>

        <!-- head -->
        <circle cx="518" cy="168" r="31" fill="#fdfaf2" stroke="#d8d0ba" stroke-width="3.5"/>

        <!-- beak + pouch -->
        <path d="M 540 150 C 592 157, 646 174, 690 193 L 683 208 C 640 191, 588 177, 537 173 Z"
              fill="#f2a54e" stroke="#d98b2d" stroke-width="3" stroke-linejoin="round"/>
        <path d="M 538 173 Q 612 238 683 208 Q 610 216 538 173 Z"
              fill="#f7bd72" stroke="#e5a14c" stroke-width="3" stroke-linejoin="round"/>

        <!-- eye (blinks) -->
        <g id="eye">
          <circle cx="525" cy="156" r="7" fill="#2b2b2b"/>
          <circle cx="527.5" cy="153.5" r="2.5" fill="#ffffff"/>
        </g>

        <!-- extended wing gripping the bar (flaps gently) -->
        <g id="wing">
          <path d="M 424 250 C 470 230, 532 226, 578 239 C 588 242, 590 253, 580 259 C 534 270, 470 277, 428 273 Z"
                fill="#f7f2e4" stroke="#d8d0ba" stroke-width="3" stroke-linejoin="round"/>
          <path d="M 556 246 C 566 246, 574 248, 580 252" fill="none" stroke="#d5cdb6" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M 552 256 C 562 258, 570 259, 578 259" fill="none" stroke="#d5cdb6" stroke-width="2.5" stroke-linecap="round"/>
        </g>

        <!-- chest shading -->
        <path d="M 352 300 C 372 312, 396 312, 412 302" fill="none" stroke="#e8e0ca" stroke-width="3" stroke-linecap="round"/>
        <path d="M 336 312 C 356 324, 384 324, 402 314" fill="none" stroke="#e8e0ca" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- feet: translate only, always level, anchored to pedal pins -->
      <path id="footB" d="M 345 396 L 377 396 L 361 412 Z" fill="#c97f2e" stroke="#b06d22" stroke-width="2" stroke-linejoin="round" opacity="0.85"/>
      <path id="footA" d="M 415 470 L 447 470 L 431 486 Z" fill="#ef9a3d" stroke="#d98b2d" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <figcaption>SVG &middot; animated pelican on a bicycle</figcaption>
  </figure>
</main>

<script>
(function () {
  "use strict";

  /* ---- constants (single clock: wheel rev = PERIOD_W ms, crank rev = 2x, = ring 26 / cog 13) ---- */
  var RW = 85.5, CIRC = 2 * Math.PI * RW;      /* tyre outer radius / circumference */
  var PERIOD_W = 1400, PERIOD_C = 2800;        /* ms per wheel rev / per crank rev */
  var BBx = 395, BBy = 438, CRANK = 51;        /* bottom bracket + crank arm length */
  var TH0 = Math.atan2(37, 35);                /* pinA start angle -> pinA0 = (430,475) */
  var TILE = CIRC / 4;                         /* road dash spacing == wrap modulus */
  var CLOUD = 420;                             /* cloud spacing == wrap modulus */
  var CHAIN_DASH = 16;                         /* dash pattern period (9+7) */
  var CHAIN_RATIO = 26 / RW;                   /* chain speed / rim speed = ring r / RW */

  /* pedal pins at t=0 (static frame matches draw(0)) */
  var pinA0x = 430, pinA0y = 475, pinB0x = 360, pinB0y = 401;

  /* legs: two-bone IK, forward knee fold for both (same sign -> same fold) */
  var hipAx = 400, hipAy = 314, hipBx = 348, hipBy = 324, L1 = 95, L2 = 85;

  var el = function (id) { return document.getElementById(id); };
  var spokesR = el("spokesR"), spokesF = el("spokesF"), crank = el("crank"),
      pedalA = el("pedalA"), pedalB = el("pedalB"),
      footA = el("footA"), footB = el("footB"),
      legA = el("legA"), legB = el("legB"),
      road = el("road"), clouds = el("clouds"),
      chainA = el("chainA"), chainB = el("chainB"),
      pelican = el("pelican"), wing = el("wing"), eye = el("eye");

  function fmt(x) { return Math.round(x * 1000) / 1000; }

  /* knee = hip + a*u + h*perp(u); perp=(uy,-ux) -> cross(u, knee-hip) < 0 for both legs */
  function ik(hx, hy, px, py, out) {
    var dx = px - hx, dy = py - hy;
    var d = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / d, uy = dy / d;
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h2 = L1 * L1 - a * a;
    var h = h2 > 0 ? Math.sqrt(h2) : 0;
    out[0] = hx + a * ux + h * uy;
    out[1] = hy + a * uy - h * ux;
  }

  var k = [0, 0];

  function draw(t) {
    var radW = 2 * Math.PI * t / PERIOD_W;
    var radC = 2 * Math.PI * t / PERIOD_C;
    var degW = radW * 180 / Math.PI;
    var degC = radC * 180 / Math.PI;
    var dist = CIRC * t / PERIOD_W;            /* continuous rolling distance */

    /* pedal pins on the crank circle */
    var ax = BBx + CRANK * Math.cos(TH0 + radC);
    var ay = BBy + CRANK * Math.sin(TH0 + radC);
    var bx = BBx - CRANK * Math.cos(TH0 + radC);
    var by = BBy - CRANK * Math.sin(TH0 + radC);

    /* wheels about explicit hub centres (never CSS transform-origin) */
    spokesR.setAttribute("transform", "rotate(" + fmt(degW) + " 250 420)");
    spokesF.setAttribute("transform", "rotate(" + fmt(degW) + " 570 420)");

    /* crank about BB; pedals counter-rotate -> net 0, stay level */
    crank.setAttribute("transform", "rotate(" + fmt(degC) + " 395 438)");
    pedalA.setAttribute("transform", "rotate(" + fmt(-degC) + " 430 475)");
    pedalB.setAttribute("transform", "rotate(" + fmt(-degC) + " 360 401)");

    /* feet: translate only -> 0 deg rotation, 0 px offset from pedal pins */
    footA.setAttribute("transform", "translate(" + fmt(ax - pinA0x) + " " + fmt(ay - pinA0y) + ")");
    footB.setAttribute("transform", "translate(" + fmt(bx - pinB0x) + " " + fmt(by - pinB0y) + ")");

    /* pelican bob: hips move with body, IK targets the live pins */
    var bob = 2.2 * Math.sin(2 * radC);
    var hAy = hipAy + bob, hBy = hipBy + bob;
    ik(hipAx, hAy, ax, ay, k);
    legA.setAttribute("d", "M " + hipAx + " " + fmt(hAy) + " L " + fmt(k[0]) + " " + fmt(k[1]) + " L " + fmt(ax) + " " + fmt(ay));
    ik(hipBx, hBy, bx, by, k);
    legB.setAttribute("d", "M " + hipBx + " " + fmt(hBy) + " L " + fmt(k[0]) + " " + fmt(k[1]) + " L " + fmt(bx) + " " + fmt(by));

    pelican.setAttribute("transform", "translate(0 " + fmt(bob) + ")");
    wing.setAttribute("transform", "rotate(" + fmt(4.5 * Math.sin(2 * radC + 0.8)) + " 424 250)");
    var blinkPhase = t % 3600;
    var s = (blinkPhase >= 3200 && blinkPhase < 3340) ? 0.1 : 1;
    eye.setAttribute("transform", "translate(525 156) scale(1 " + s + ") translate(-525 -156)");

    /* seamless wraps: modulus == pattern spacing */
    road.setAttribute("transform", "translate(" + fmt(-(dist % TILE)) + " 0)");
    clouds.setAttribute("transform", "translate(" + fmt(-((dist * 0.2) % CLOUD)) + " 0)");

    /* chain dashes scroll at chain speed */
    var chainOff = -((dist * CHAIN_RATIO) % CHAIN_DASH);
    chainA.setAttribute("stroke-dashoffset", fmt(chainOff));
    chainB.setAttribute("stroke-dashoffset", fmt(chainOff));
  }

  window.__draw = draw;   /* deterministic-frame hook for verification */

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  draw(0);
  if (!reduced) {
    requestAnimationFrame(function frame(ts) {
      draw(ts);
      requestAnimationFrame(frame);
    });
  }
})();
</script>
</body>
</html>
