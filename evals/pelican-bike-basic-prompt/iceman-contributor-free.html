<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelican Riding a Bicycle</title>
  <style>
    body {
      background: #f0f8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    svg {
      max-width: 90vw;
      max-height: 90vh;
    }
    .wheel {
      transform-origin: center;
      animation: spin 0.8s linear infinite;
    }
    .bike {
      animation: ride 4s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ride {
      from { transform: translateX(-50px); }
      to { transform: translateX(50px); }
    }
  </style>
</head>
<body>
  <svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <g class="bike">
      <!-- Wheels -->
      <g class="wheel" transform-origin="100 200">
        <circle cx="100" cy="200" r="40" fill="none" stroke="#333" stroke-width="6"/>
        <circle cx="100" cy="200" r="3" fill="#333"/>
        <line x1="100" y1="200" x2="100" y2="160" stroke="#333" stroke-width="2"/>
        <line x1="100" y1="200" x2="140" y2="200" stroke="#333" stroke-width="2"/>
        <line x1="100" y1="200" x2="100" y2="240" stroke="#333" stroke-width="2"/>
        <line x1="100" y1="200" x2="60" y2="200" stroke="#333" stroke-width="2"/>
      </g>
      <g class="wheel" transform-origin="250 200">
        <circle cx="250" cy="200" r="40" fill="none" stroke="#333" stroke-width="6"/>
        <circle cx="250" cy="200" r="3" fill="#333"/>
        <line x1="250" y1="200" x2="250" y2="160" stroke="#333" stroke-width="2"/>
        <line x1="250" y1="200" x2="290" y2="200" stroke="#333" stroke-width="2"/>
        <line x1="250" y1="200" x2="250" y2="240" stroke="#333" stroke-width="2"/>
        <line x1="250" y1="200" x2="210" y2="200" stroke="#333" stroke-width="2"/>
      </g>
    
    <!-- Bicycle Frame -->
    <line x1="100" y1="200" x2="175" y2="150" stroke="#d2691e" stroke-width="6"/>
    <line x1="175" y1="150" x2="250" y2="200" stroke="#d2691e" stroke-width="6"/>
    <line x1="175" y1="150" x2="140" y2="120" stroke="#d2691e" stroke-width="6"/>
    <line x1="140" y1="120" x2="100" y2="200" stroke="#d2691e" stroke-width="6"/>
    <line x1="250" y1="200" x2="200" y2="130" stroke="#d2691e" stroke-width="6"/>
    
    <!-- Handlebars -->
    <line x1="140" y1="120" x2="120" y2="110" stroke="#333" stroke-width="4"/>
    <line x1="120" y1="110" x2="110" y2="115" stroke="#333" stroke-width="4"/>
    
    <!-- Seat -->
    <line x1="200" y1="130" x2="185" y2="115" stroke="#333" stroke-width="4"/>
    
    <!-- Pelican Body -->
    <ellipse cx="175" cy="110" rx="25" ry="18" fill="#f5f5dc" stroke="#8b7355" stroke-width="2"/>
    
    <!-- Pelican Neck and Head -->
    <path d="M 195 105 Q 215 95 230 100 Q 235 110 230 120 Q 210 125 195 115 Z" fill="#f5f5dc" stroke="#8b7355" stroke-width="2"/>
    
    <!-- Beak -->
    <path d="M 230 110 L 260 108 L 230 112 Z" fill="#ffa500" stroke="#ff8c00" stroke-width="1"/>
    
    <!-- Eye -->
    <circle cx="228" cy="108" r="2" fill="#333"/>
    
    <!-- Wing -->
    <path d="M 170 100 Q 150 90 140 100 Q 150 110 170 105 Z" fill="#e6ddd4" stroke="#8b7355" stroke-width="2"/>
    
    <!-- Feet on Pedals -->
    <ellipse cx="165" cy="170" rx="8" ry="4" fill="#f5f5dc" stroke="#8b7355" stroke-width="2"/>
    <ellipse cx="185" cy="170" rx="8" ry="4" fill="#f5f5dc" stroke="#8b7355" stroke-width="2"/>
    <circle cx="165" cy="170" r="3" fill="#333"/>
    <circle cx="185" cy="170" r="3" fill="#333"/>
  </svg>
</body>
</html>
