<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root{
    --bg:#0d151c; --panel:#152029; --line:#253440; --fg:#e9eff4; --muted:#93a6b5; --accent:#ffc24b;
    --speed:1;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:26px 18px;
    font-family:ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
    color:var(--fg);
    background:radial-gradient(1100px 620px at 50% -12%,#1a2a36,var(--bg));
  }
  .wrap{width:min(960px,100%)}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 2px 12px}
  h1{font-size:17px;margin:0;letter-spacing:.02em;font-weight:650}
  .sub{font-size:13px;color:var(--muted)}
  .stage{position:relative;border-radius:18px;overflow:hidden;background:#0b1219;border:1px solid var(--line);
         box-shadow:0 26px 64px rgba(0,0,0,.45)}
  svg{display:block;width:100%;height:auto}
  .bar{display:flex;align-items:center;gap:14px;padding:11px 14px;border-top:1px solid var(--line);
       background:var(--panel);flex-wrap:wrap}
  button{font:inherit;color:var(--fg);background:#22313e;border:1px solid #34485a;border-radius:10px;
         padding:7px 14px;cursor:pointer;transition:background .15s,transform .08s}
  button:hover{background:#2b3d4d}
  button:active{transform:translateY(1px)}
  button.ghost{background:transparent}
  input[type=range]{width:150px;accent-color:var(--accent)}
  label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:9px}
  .val{color:var(--fg);font-variant-numeric:tabular-nums;min-width:38px;display:inline-block}
  .hint{font-size:12px;color:var(--muted);margin-left:auto}

  /* ---------- 动画（次要动作走 CSS，主循环走 JS） ---------- */
  svg *{transform-box:view-box}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
  @keyframes pouch{0%,100%{transform:rotate(0deg) scaleY(1)}50%{transform:rotate(3.2deg) scaleY(1.09)}}
  @keyframes flap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}}
  @keyframes scarf{0%,100%{transform:rotate(-4deg) skewX(0deg)}50%{transform:rotate(7deg) skewX(6deg)}}
  @keyframes tail{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3.5deg)}}
  .blink{transform-origin:592px 128px;animation:blink 4.6s ease-in-out infinite}
  .pouch{transform-origin:614px 150px;animation:pouch 1.15s ease-in-out infinite}
  .wing{transform-origin:400px 226px;animation:flap 2.3s ease-in-out infinite}
  .scarf{transform-origin:506px 200px;animation:scarf .85s ease-in-out infinite}
  .tail{transform-origin:352px 216px;animation:tail 1.6s ease-in-out infinite}
  .paused svg *{animation-play-state:paused !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>鹈鹕骑自行车</h1>
    <span class="sub">纯 SVG 绘制 · 双骨 IK 骑踏循环 · 视差滚动背景</span>
  </header>

  <div class="stage">
    <svg id="scene" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="一只鹈鹕骑着自行车的二维动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4fb3df"/>

          <stop offset="1" stop-color="#e9f7fd"/>
        </linearGradient>
        <radialGradient id="sunG" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#fff6d0" stop-opacity=".95"/>
          <stop offset=".45" stop-color="#ffd76a" stop-opacity=".5"/>
          <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">

        </linearGradient>
        <linearGradient id="wingG" x1="0" y1="0" x2=".35" y2="1">
          <stop offset="0" stop-color="#dae1e7"/><stop offset="1" stop-color="#a3b2c0"/>
        </linearGradient>
        <linearGradient id="beakG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd97a"/><stop offset="1" stop-color="#f0a92f"/>

    <div class="bar">

      <span class="hint">车轮 / 曲柄 / 背景速度同步 · 腿用两骨 IK 解算，踩在踏板上</span>

<script>
(function () {
  var svg      = document.getElementById('scene');
  var rider    = document.getElementById('rider');
  var body     = document.getElementById('body');
  var crank    = document.getElementById('crank');
  var wheelR   = document.getElementById('wheelRear');
  var wheelF   = document.getElementById('wheelFront');
  var thighF   = document.getElementById('thighF');
  var shinF    = document.getElementById('shinF');
  var thighB   = document.getElementById('thighB');
  var shinB    = document.getElementById('shinB');
  var dashes   = document.getElementById('dashes');
  var tufts    = document.getElementById('tufts');
  var bushes   = document.getElementById('bushes');
  var nearH    = document.getElementById('nearHills');
  var farH     = document.getElementById('farHills');
  var clouds   = document.getElementById('clouds');

  var BB   = { x: 462, y: 340 };   // 中轴
  var CR   = 26;                  // 曲柄半径
  var L1   = 52, L2 = 46;         // 大腿 / 小腿长度
  var HIPF = { x: 452, y: 272 };   // 近侧髋
  var HIPB = { x: 436, y: 276 };   // 远侧髋
  var WHEEL_R = 48;
  var PERIOD = 1.2;               // 一圈踏板 / 一圈车轮的秒数

  var speed = 1, running = true, simT = 0, last = performance.now();

  // 两骨 IK：给定髋与脚，解出膝的位置
  function kneeOf(hip, foot, bend) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var max = L1 + L2 - 0.5;
    if (d > max) { var k = max / d; dx *= k; dy *= k; d = max; }
    if (d < 0.001) d = 0.001;
    var cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    var a = Math.acos(Math.max(-1, Math.min(1, cosA)));
    var base = Math.atan2(dy, dx);
    var ang = base + bend * a;
    return { x: hip.x + L1 * Math.cos(ang), y: hip.y + L1 * Math.sin(ang) };
  }

  // 更新一条腿：thigh 绕髋转，shin 绕膝转，脚精确落在踏板圆上
  function setLeg(thigh, shin, hip, theta, bend, bob) {
    var px = BB.x + CR * Math.cos(theta);
    var py = BB.y + CR * Math.sin(theta) - bob;   // 抵消身体的上下浮动
    var foot = { x: px, y: py };
    var knee = kneeOf(hip, foot, bend);

    var th = Math.atan2(-(knee.x - hip.x), knee.y - hip.y) * 180 / Math.PI;
    thigh.setAttribute('transform', 'translate(' + hip.x + ' ' + hip.y + ') rotate(' + th.toFixed(2) + ')');

    // 脚相对膝的向量，逆旋转 thigh 角度 -> thigh 局部坐标
    var rad = th * Math.PI / 180, c = Math.cos(rad), s = Math.sin(rad);
    var vx = foot.x - knee.x, vy = foot.y - knee.y;
    var rx = vx * c + vy * s;
    var ry = -vx * s + vy * c;
    var beta = Math.atan2(-rx, ry) * 180 / Math.PI;
    shin.setAttribute('transform', 'translate(0 ' + L1 + ') rotate(' + beta.toFixed(2) + ')');
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) simT += dt * speed;

    var t = simT;
    var theta = t * (2 * Math.PI / PERIOD);      // 踏板角
    var bob = -1.2 - 1.6 * Math.sin(theta * 2);   // 身体上下起伏

    rider.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    body.setAttribute('transform', 'rotate(' + (1.1 * Math.sin(theta * 2)).toFixed(2) + ' 438 268)');

    var deg = theta * 180 / Math.PI;
    crank.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ' ' + BB.x + ' ' + BB.y + ')');

    var spin = (t / PERIOD) * 360;
    wheelR.setAttribute('transform', 'rotate(' + spin.toFixed(2) + ' 320 352)');
    wheelF.setAttribute('transform', 'rotate(' + spin.toFixed(2) + ' 640 352)');

    setLeg(thighF, shinF, HIPF, theta, 1, bob);
    setLeg(thighB, shinB, HIPB, theta + Math.PI, -1, bob);

    // 背景视差：地面速度与车轮转速一致（v = 2πr / PERIOD）
    var v = 2 * Math.PI * WHEEL_R / PERIOD;
    dashes.setAttribute('transform', 'translate(' + (-(v * t) % 90).toFixed(2) + ' 0)');
    tufts.setAttribute('transform',  'translate(' + (-(v * t) % 120).toFixed(2) + ' 0)');
    bushes.setAttribute('transform', 'translate(' + (-(v * 0.55 * t) % 300).toFixed(2) + ' 0)');
    nearH.setAttribute('transform',  'translate(' + (-(v * 0.32 * t) % 600).toFixed(2) + ' 0)');
    farH.setAttribute('transform',   'translate(' + (-(v * 0.14 * t) % 600).toFixed(2) + ' 0)');
    clouds.setAttribute('transform', 'translate(' + (-(v * 0.05 * t) % 900).toFixed(2) + ' 0)');

    if (running) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  var toggle = document.getElementById('toggle');
  var reset  = document.getElementById('reset');
  var slider = document.getElementById('speed');
  var val    = document.getElementById('speedVal');

  toggle.addEventListener('click', function () {
    running = !running;
    toggle.textContent = running ? '⏸ 暂停' : '▶ 播放';
    document.body.classList.toggle('paused', !running);
    if (running) { last = performance.now(); requestAnimationFrame(frame); }
  });
  reset.addEventListener('click', function () {
    simT = 0; last = performance.now();
    if (!running) { running = true; toggle.textContent = '⏸ 暂停'; document.body.classList.remove('paused'); requestAnimationFrame(frame); }
  });
  slider.addEventListener('input', function () {
    speed = parseFloat(slider.value);
    val.textContent = speed.toFixed(2) + '×';
  });
})();
</script>
</body>
</html>
