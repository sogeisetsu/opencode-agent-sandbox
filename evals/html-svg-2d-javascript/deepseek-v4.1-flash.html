<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐙 骑自行车的章鱼 · SVG 2D 动画</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #dff3fb;
  }
  #stage {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .panel {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .55);
    border: 1px solid rgba(255, 255, 255, .8);
    box-shadow: 0 8px 24px rgba(20, 60, 90, .18);
    backdrop-filter: blur(8px);
    font: 13px/1 system-ui, "Segoe UI", sans-serif;
    color: #24506b;
    user-select: none;
  }
  .panel button {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: #2aa9a0;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .panel button:hover { background: #228d86; }
  .panel input[type="range"] {
    width: 110px;
    accent-color: #2aa9a0;
    cursor: pointer;
  }
  .panel .val {
    min-width: 34px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="一只橙色章鱼骑着自行车向前行驶的 2D 动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#7fd1ef"/>
      <stop offset="0.55" stop-color="#bfe8f8"/>
      <stop offset="1"    stop-color="#eaf9ff"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0"   stop-color="#ffe9a8" stop-opacity=".95"/>
      <stop offset="0.45" stop-color="#ffe9a8" stop-opacity=".35"/>
      <stop offset="1"   stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7684"/>
      <stop offset="1" stop-color="#4a5361"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0.25" y1="0" x2="0.7" y2="1">
      <stop offset="0"   stop-color="#ffb185"/>
      <stop offset="0.5" stop-color="#fb8b57"/>
      <stop offset="1"   stop-color="#ef6a35"/>
    </linearGradient>
    <linearGradient id="limbGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fc9a68"/>
      <stop offset="1" stop-color="#ea6a34"/>
    </linearGradient>
    <linearGradient id="farGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#d9602f"/>
      <stop offset="1" stop-color="#c04c22"/>
    </linearGradient>
    <filter id="blurSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- 由 JavaScript 构建并驱动 -->
  <g id="scene"></g>
</svg>

<div class="panel">
  <button id="btnPlay" title="暂停 / 继续">⏸</button>
  <input id="rngSpeed" type="range" min="0" max="2.4" step="0.05" value="1" title="速度">
  <span class="val" id="lblSpeed">1.0×</span>
</div>

<script>
"use strict";

/* =========================================================
   0. 小工具
   ========================================================= */
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
const lerp  = (a, b, k) => a + (b - a) * k;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rad   = d => (d * Math.PI) / 180;

/* Catmull-Rom 样条：用少量控制点生成平滑曲线 */
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return {
    x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t +
              (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
              (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
    y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t +
              (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
              (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
  };
}
function spline(pts, n) {
  if (pts.length === 1) return new Array(n).fill(pts[0]);
  const p = [pts[0], ...pts, pts[pts.length - 1]];
  const segs = p.length - 3;
  const out = [];
  for (let i = 0; i < n; i++) {
    const ft = (i / (n - 1)) * segs;
    const si = clamp(Math.floor(ft), 0, segs - 1);
    out.push(catmull(p[si], p[si + 1], p[si + 2], p[si + 3], ft - si));
  }
  return out;
}

/* =========================================================
   1. 场景几何常量（单位：viewBox 像素）
   ========================================================= */
const GROUND    = 585;                 // 路面高度
const WHEEL_R   = 96;
const REAR_HUB  = { x: 408, y: GROUND - WHEEL_R };
const FRONT_HUB = { x: 742, y: GROUND - WHEEL_R };
const BB        = { x: 524, y: 509 };  // 五通（中轴）
const CRANK     = 46;                  // 曲柄长度
const SEAT_TOP  = { x: 496, y: 366 };
const HEAD_TOP  = { x: 688, y: 328 };
const HEAD_BOT  = { x: 706, y: 372 };
const GRIP      = { x: 753, y: 299 };  // 车把握把
const BODY_C    = { x: 452, y: 248 };  // 章鱼头部中心

/* =========================================================
   2. 构建静态场景
   ========================================================= */
const scene = document.getElementById("scene");

/* --- 2.1 天空 / 太阳 / 云 --- */
const skyLayer = el("g", null, scene);
el("rect", { x: -200, y: -200, width: 1600, height: 900, fill: "url(#sky)" }, skyLayer);

el("circle", { cx: 986, cy: 132, r: 168, fill: "url(#sunGlow)" }, skyLayer);
el("circle", { cx: 986, cy: 132, r: 56,  fill: "#ffd977"  }, skyLayer);
el("circle", { cx: 986, cy: 132, r: 46,  fill: "#ffe9a8"  }, skyLayer);

const clouds = [];
for (let i = 0; i < 5; i++) {
  const gy = 70 + i * 46;
  const cg = el("g", { fill: "#ffffff", opacity: 0.86 }, skyLayer);
  el("ellipse", { cx: 0,   cy: 0,   rx: 62, ry: 26 }, cg);
  el("ellipse", { cx: 46,  cy: 8,   rx: 44, ry: 20 }, cg);
  el("ellipse", { cx: -46, cy: 10,  rx: 38, ry: 17 }, cg);
  el("ellipse", { cx: 8,   cy: -18, rx: 36, ry: 22 }, cg);
  clouds.push({ node: cg, y: gy, x0: i * 300 - 60, scale: 0.7 + (i % 3) * 0.22, depth: 0.05 + i * 0.012 });
}

/* --- 2.2 远山（静止） --- */
const hillLayer = el("g", null, scene);
el("path", {
  d: "M -100 585 L -100 520 C 40 430, 150 452, 250 512 C 330 560, 400 470, 520 500 " +
     "C 640 530, 700 440, 820 486 C 940 532, 1010 462, 1120 508 C 1200 542, 1280 520, 1320 500 " +
     "L 1320 585 Z",
  fill: "#8fcbb0"
}, hillLayer);
el("path", {
  d: "M -100 585 L -100 552 C 60 500, 190 528, 300 556 C 420 586, 520 524, 660 546 " +
     "C 780 566, 880 520, 1000 548 C 1120 576, 1230 540, 1320 552 L 1320 585 Z",
  fill: "#6cb894"
}, hillLayer);

/* --- 2.3 路边灌木 / 树（随路面滚动） --- */
const propsLayer = el("g", null, scene);
const props = [];
function makeTree(kind) {
  const g = el("g", null, propsLayer);
  if (kind === 0) {                    // 圆头树
    el("rect", { x: -7, y: -46, width: 14, height: 48, rx: 6, fill: "#8a6244" }, g);
    el("circle", { cx: 0,  cy: -66, r: 34, fill: "#4f9c74" }, g);
    el("circle", { cx: -22, cy: -50, r: 24, fill: "#57a97e" }, g);
    el("circle", { cx: 22,  cy: -52, r: 26, fill: "#468f69" }, g);
    el("circle", { cx: -4,  cy: -84, r: 22, fill: "#5fb489" }, g);
  } else if (kind === 1) {             // 灌木
    el("ellipse", { cx: 0,   cy: -16, rx: 40, ry: 22, fill: "#57a97e" }, g);
    el("ellipse", { cx: -24, cy: -10, rx: 26, ry: 15, fill: "#4a9a72" }, g);
    el("ellipse", { cx: 24,  cy: -12, rx: 28, ry: 16, fill: "#63b689" }, g);
  } else {                             // 小路灯柱
    el("rect", { x: -4, y: -104, width: 8, height: 108, rx: 4, fill: "#9aa7b2" }, g);
    el("path", { d: "M -4 -104 q 0 -18 22 -18 l 14 0", stroke: "#9aa7b2", "stroke-width": 8,
                 fill: "none", "stroke-linecap": "round" }, g);
    el("ellipse", { cx: 34, cy: -116, rx: 12, ry: 8, fill: "#ffe08a" }, g);
  }
  return g;
}
const propSpecs = [
  { x: 120,  kind: 2 }, { x: 340, kind: 1 }, { x: 620, kind: 0 },
  { x: 900,  kind: 1 }, { x: 1140, kind: 0 }, { x: 1420, kind: 2 },
  { x: 1680, kind: 1 }
];
for (const s of propSpecs) props.push({ node: makeTree(s.kind), x0: s.x, scale: 1 });

/* --- 2.4 路面 --- */
const roadLayer = el("g", null, scene);
el("rect", { x: -200, y: GROUND, width: 1600, height: 240, fill: "url(#roadGrad)" }, roadLayer);
el("rect", { x: -200, y: GROUND - 8, width: 1600, height: 10, fill: "#8794a0" }, roadLayer);
el("rect", { x: -200, y: GROUND + 2, width: 1600, height: 4, fill: "#39414d", opacity: .5 }, roadLayer);

const DASH_N = 15, DASH_GAP = 150, DASH_SPAN = DASH_GAP * DASH_N;
const dashes = [];
for (let i = 0; i < DASH_N; i++) {
  dashes.push(el("rect", { x: i * DASH_GAP, y: 646, width: 74, height: 11, rx: 5, fill: "#eef3f6", opacity: .55 }, roadLayer));
}

/* --- 2.5 地面投影 --- */
const shadow = el("ellipse", { cx: 575, cy: GROUND + 10, rx: 250, ry: 17,
                               fill: "#1d2530", opacity: .18, filter: "url(#blurSoft)" }, scene);

/* --- 2.6 气泡（章鱼的小趣味） --- */
const bubbleLayer = el("g", null, scene);
const bubbles = [];
for (let i = 0; i < 16; i++) {
  const b = {
    node: el("circle", { r: 0, fill: "#ffffff", opacity: 0 }, bubbleLayer),
    x: 0, y: 0, r: 0, vy: 0, vx: 0, life: 0
  };
  resetBubble(b, true);
  bubbles.push(b);
}
function resetBubble(b, initial) {
  b.r = 3 + Math.random() * 7;
  b.x = 250 + Math.random() * 430;
  b.y = initial ? 180 + Math.random() * 320 : 340 + Math.random() * 60;
  b.vx = -22 - Math.random() * 22;
  b.vy = -34 - Math.random() * 26;
  b.life = 0.8 + Math.random() * 1.4;
}

/* =========================================================
   3. 自行车
   ========================================================= */
const bikeLayer = el("g", null, scene);

function makeWheel(hub) {
  const g = el("g", { transform: `translate(${hub.x} ${hub.y})` }, bikeLayer);
  el("circle", { r: WHEEL_R,     fill: "none", stroke: "#2e3440", "stroke-width": 11 }, g);
  el("circle", { r: WHEEL_R - 6, fill: "none", stroke: "#dbe6ec", "stroke-width": 5  }, g);
  const spokes = el("g", { stroke: "#aab8c2", "stroke-width": 2.2, opacity: .95 }, g);
  for (let i = 0; i < 12; i++) {
    el("line", { x1: -WHEEL_R + 14, y1: 0, x2: WHEEL_R - 14, y2: 0,
                 transform: `rotate(${i * 15})` }, spokes);
  }
  el("circle", { r: 11, fill: "#9aa7b2" }, g);
  el("circle", { r: 5,  fill: "#e6eef3" }, g);
  return spokes;
}
const rearSpokes  = makeWheel(REAR_HUB);
const frontSpokes = makeWheel(FRONT_HUB);

/* 链条 */
el("path", {
  d: `M ${BB.x} ${BB.y - 24} L ${REAR_HUB.x} ${REAR_HUB.y - 11} ` +
     `M ${BB.x} ${BB.y + 24} L ${REAR_HUB.x} ${REAR_HUB.y + 11}`,
  stroke: "#8b96a1", "stroke-width": 3, fill: "none", opacity: .95
}, bikeLayer);
el("circle", { cx: REAR_HUB.x, cy: REAR_HUB.y, r: 12, fill: "none", stroke: "#9aa7b2", "stroke-width": 3 }, bikeLayer);

/* 车架 */
el("path", {
  d: [
    `M ${BB.x} ${BB.y} L ${REAR_HUB.x} ${REAR_HUB.y}`,
    `M ${BB.x} ${BB.y} L ${SEAT_TOP.x} ${SEAT_TOP.y}`,
    `M ${SEAT_TOP.x} ${SEAT_TOP.y} L ${REAR_HUB.x} ${REAR_HUB.y}`,
    `M ${BB.x} ${BB.y} L ${HEAD_BOT.x} ${HEAD_BOT.y}`,
    `M ${SEAT_TOP.x} ${SEAT_TOP.y} L ${HEAD_TOP.x} ${HEAD_TOP.y}`,
    `M ${HEAD_TOP.x} ${HEAD_TOP.y} L ${HEAD_BOT.x} ${HEAD_BOT.y}`,
    `M ${HEAD_BOT.x} ${HEAD_BOT.y} C 712 424, 726 458, ${FRONT_HUB.x} ${FRONT_HUB.y}`,
    `M ${HEAD_TOP.x} ${HEAD_TOP.y} L 704 296`
  ].join(" "),
  stroke: "#2aa9a0", "stroke-width": 13, fill: "none",
  "stroke-linecap": "round", "stroke-linejoin": "round"
}, bikeLayer);
el("path", {   // 车架高光
  d: `M ${BB.x} ${BB.y} L ${HEAD_BOT.x} ${HEAD_BOT.y}`,
  stroke: "#7fe0d6", "stroke-width": 4, fill: "none", "stroke-linecap": "round", opacity: .8
}, bikeLayer);

/* 车把 */
el("path", {
  d: "M 668 292 C 696 272, 736 272, 766 296",
  stroke: "#3b4652", "stroke-width": 9, fill: "none", "stroke-linecap": "round"
}, bikeLayer);
el("path", {
  d: "M 738 283 L 762 297",
  stroke: "#4a3b34", "stroke-width": 14, fill: "none", "stroke-linecap": "round"
}, bikeLayer);

/* 坐垫 */
el("ellipse", { cx: 484, cy: 352, rx: 46, ry: 13, fill: "#4a3b34",
                transform: "rotate(-8 484 352)" }, bikeLayer);
el("ellipse", { cx: 480, cy: 349, rx: 40, ry: 8, fill: "#6b544a",
                transform: "rotate(-8 480 349)" }, bikeLayer);

/* 中轴 + 曲柄 + 踏板 */
el("circle", { cx: BB.x, cy: BB.y, r: 27, fill: "none", stroke: "#b8c4ce", "stroke-width": 6 }, bikeLayer);
el("circle", { cx: BB.x, cy: BB.y, r: 27, fill: "none", stroke: "#8c99a6", "stroke-width": 2, "stroke-dasharray": "3 5" }, bikeLayer);

function makeCrank(shade, w) {
  const g = el("g", null, bikeLayer);
  const arm = el("line", { x1: BB.x, y1: BB.y, x2: BB.x, y2: BB.y,
                           stroke: shade, "stroke-width": w, "stroke-linecap": "round" }, g);
  const pad = el("rect", { x: 0, y: 0, width: 30, height: 9, rx: 3, fill: shade }, g);
  return { arm, pad };
}
const crankFar  = makeCrank("#7c858f", 7);
const crankNear = makeCrank("#c3ced7", 8);

/* =========================================================
   4. 章鱼（身体 / 眼睛 / 触手）
   ========================================================= */
/* --- 4.1 触手绘制器 --- */
function makeTentacle(parent, color, w0, w1, suckerColor, suckerCount) {
  const g = el("g", null, parent);
  const path = el("path", { fill: color, stroke: "none" }, g);
  const dots = [];
  for (let i = 0; i < suckerCount; i++) {
    dots.push(el("circle", { fill: suckerColor, opacity: .8 }, g));
  }
  return { path, dots, w0, w1, n: 30 };
}

const SUCKER_FRACS = [0.14, 0.27, 0.40, 0.53, 0.66, 0.79];

function updateTentacle(t, ctrl) {
  const n = t.n;
  const pts = spline(ctrl, n);
  const dir = [], half = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b.x - a.x, dy = b.y - a.y;
    const L = Math.hypot(dx, dy) || 1;
    dx /= L; dy /= L;
    dir.push([dx, dy]);
    half.push(lerp(t.w0, t.w1, Math.pow(i / (n - 1), 0.85)) * 0.5);
  }

  // A 侧轮廓
  const A = [];
  for (let i = 0; i < n; i++) {
    const [dx, dy] = dir[i], w = half[i];
    A.push([pts[i].x - dy * w, pts[i].y + dx * w]);
  }
  // 末端圆头
  const [tdx, tdy] = dir[n - 1];
  const r = half[n - 1], tip = pts[n - 1], K = 8, cap = [];
  for (let k = 1; k <= K; k++) {
    const b = (k / K) * Math.PI;
    cap.push([
      tip.x + tdx * Math.sin(b) * r - tdy * Math.cos(b) * r,
      tip.y + tdy * Math.sin(b) * r + tdx * Math.cos(b) * r
    ]);
  }
  // B 侧（反向）
  const B = [];
  for (let i = n - 1; i >= 0; i--) {
    const [dx, dy] = dir[i], w = half[i];
    B.push([pts[i].x + dy * w, pts[i].y - dx * w]);
  }

  let d = `M${A[0][0].toFixed(1)} ${A[0][1].toFixed(1)}`;
  for (let i = 1; i < A.length; i++) d += `L${A[i][0].toFixed(1)} ${A[i][1].toFixed(1)}`;
  for (const [x, y] of cap) d += `L${x.toFixed(1)} ${y.toFixed(1)}`;
  for (let i = 1; i < B.length; i++) d += `L${B[i][0].toFixed(1)} ${B[i][1].toFixed(1)}`;
  d += "Z";
  t.path.setAttribute("d", d);

  // 吸盘：统一贴在“下侧”
  const mi = Math.floor(n * 0.45);
  const sgn = dir[mi][0] >= 0 ? 1 : -1;
  for (let k = 0; k < t.dots.length; k++) {
    const i = Math.round(SUCKER_FRACS[k % SUCKER_FRACS.length] * (n - 1));
    const [dx, dy] = dir[i], w = half[i];
    const dot = t.dots[k];
    dot.setAttribute("cx", (pts[i].x - dy * w * 0.34 * sgn).toFixed(1));
    dot.setAttribute("cy", (pts[i].y + dx * w * 0.34 * sgn).toFixed(1));
    dot.setAttribute("r",  (w * 0.46).toFixed(1));
  }
}

/* --- 4.2 图层顺序：后侧肢体 → 车 → 身体 → 前侧肢体 --- */
const backLimbs  = el("g", null, scene);
const frontLimbs = el("g", null, scene);

const FAR_C  = "url(#farGrad)";
const NEAR_C = "url(#limbGrad)";

// 拖在身后的 4 条触手
const trailArms = [
  { o: [406, 330], tip: [172, 292], amp: 26, ph: 0.0, w0: 28, w1: 8 },
  { o: [396, 312], tip: [118, 372], amp: 32, ph: 0.9, w0: 26, w1: 7 },
  { o: [386, 294], tip: [142, 456], amp: 36, ph: 1.9, w0: 24, w1: 7 },
  { o: [376, 276], tip: [198, 522], amp: 30, ph: 2.8, w0: 22, w1: 6 }
].map(a => ({ ...a, t: makeTentacle(backLimbs, NEAR_C, a.w0, a.w1, "#ffe2d2", 6) }));

// 后侧手臂（握把）+ 后侧腿（远侧脚踏）
const farArm  = { t: makeTentacle(backLimbs, FAR_C, 24, 8, "#ffd3c0", 5) };
const farLeg  = { t: makeTentacle(backLimbs, FAR_C, 30, 9, "#ffd3c0", 6) };
// 前侧手臂 + 前侧腿
const nearArm = { t: makeTentacle(frontLimbs, NEAR_C, 26, 10, "#ffe2d2", 5) };
const nearLeg = { t: makeTentacle(frontLimbs, NEAR_C, 32, 11, "#ffe2d2", 6) };

/* --- 4.3 身体 --- */
const bodyLayer = el("g", null, scene);
const bodyG = el("g", null, bodyLayer);

el("path", {
  d: "M 452 158 C 520 158 558 200 554 252 C 552 288 538 312 520 328 " +
     "C 500 346 472 350 452 350 C 430 350 402 344 384 326 " +
     "C 366 308 352 284 352 250 C 348 200 384 158 452 158 Z",
  fill: "url(#bodyGrad)"
}, bodyG);
el("path", {   // 顶部高光
  d: "M 392 206 C 410 176 452 164 486 172 C 452 178 420 194 404 224 C 396 240 394 250 392 258 " +
     "C 384 242 384 222 392 206 Z",
  fill: "#ffd0b0", opacity: .55
}, bodyG);
el("path", {   // 底部暗部
  d: "M 372 300 C 392 336 424 350 452 350 C 486 350 516 336 534 306 " +
     "C 520 332 494 344 452 344 C 410 344 386 330 372 300 Z",
  fill: "#d8541f", opacity: .35
}, bodyG);

// 腮红
el("ellipse", { cx: 398, cy: 272, rx: 17, ry: 10, fill: "#ff5b5b", opacity: .32 }, bodyG);
el("ellipse", { cx: 512, cy: 272, rx: 17, ry: 10, fill: "#ff5b5b", opacity: .32 }, bodyG);

// 眼睛
function makeEye(cx, cy) {
  const g = el("g", { transform: `translate(${cx} ${cy})` }, bodyG);
  el("ellipse", { rx: 24, ry: 25, fill: "#ffffff" }, g);
  el("ellipse", { rx: 24, ry: 25, fill: "none", stroke: "#e46b39", "stroke-width": 2.5, opacity: .6 }, g);
  el("circle", { cx: 4, cy: 3, r: 12, fill: "#26243c" }, g);
  el("circle", { cx: -1, cy: -3, r: 4.6, fill: "#ffffff" }, g);
  el("circle", { cx: 8, cy: 7, r: 2.4, fill: "#ffffff", opacity: .8 }, g);
  return g;
}
const eyeL = makeEye(414, 236);
const eyeR = makeEye(492, 236);

// 嘴（小嘴 + 笑容）
el("path", { d: "M 434 292 q 18 17 36 0", stroke: "#a83b1c", "stroke-width": 5.5,
             fill: "none", "stroke-linecap": "round" }, bodyG);
el("ellipse", { cx: 452, cy: 285, rx: 7, ry: 5, fill: "#a83b1c", opacity: .55 }, bodyG);

/* --- 4.4 围巾（在脑后迎风飘） --- */
const scarfT = makeTentacle(backLimbs, "#e8455c", 22, 7, "#ff8fa3", 3);

/* =========================================================
   5. 运动学辅助
   ========================================================= */
function pedalPos(angle) {
  // 顺时针（下→后→上→前），与车轮同向；车前进时链条不可能反向带动曲柄
  return { x: BB.x - CRANK * Math.sin(angle), y: BB.y + CRANK * Math.cos(angle) };
}

/* 两段式 IK：返回膝（肘）关节位置 */
function twoBoneIK(hip, foot, l1, l2, bend) {
  let dx = foot.x - hip.x, dy = foot.y - hip.y;
  let d = Math.hypot(dx, dy) || 1e-4;
  const maxD = (l1 + l2) * 0.995;
  if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
  const a = (d * d + l1 * l1 - l2 * l2) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / d, uy = dy / d;
  return {
    knee: { x: hip.x + ux * a - uy * h * bend, y: hip.y + uy * a + ux * h * bend },
    foot: { x: hip.x + dx,        y: hip.y + dy }
  };
}

/* =========================================================
   6. 状态与动画循环
   ========================================================= */
const state = {
  T: 0,           // 总时间
  crank: rad(70), // 曲柄角
  wheel: 0,       // 车轮角（弧度）
  road: 0,        // 路面滚动距离
  cloud: 0,
  speed: 1,
  paused: false,
  blinkT: -1,
  blinkNext: 1.6
};

const CRANK_OMEGA = 2.2;        // 踩踏角速度 (rad/s)
const GEAR        = 2.35;       // 传动比
const SCROLL      = 0.5;        // 画面滚动与轮速的比例（视觉调速）

function step(dt) {
  state.T += dt;
  state.crank += CRANK_OMEGA * dt;
  state.wheel += CRANK_OMEGA * GEAR * dt;
  state.road  += WHEEL_R * CRANK_OMEGA * GEAR * SCROLL * dt;
  state.cloud += 7 * dt;

  // 眨眼
  if (state.blinkT >= 0) {
    state.blinkT += dt;
    if (state.blinkT > 0.16) { state.blinkT = -1; state.blinkNext = 1.8 + Math.random() * 2.6; }
  } else {
    state.blinkNext -= dt;
    if (state.blinkNext <= 0) state.blinkT = 0;
  }

  // 气泡
  for (const b of bubbles) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || b.y < 60) resetBubble(b, false);
  }
}

/* ---------------- 渲染 ---------------- */
function render() {
  const T = state.T, crank = state.crank;
  const bob   = Math.sin(crank * 2) * 3.6;          // 踩踏引起的上下起伏
  const lean  = Math.sin(crank * 2 + 0.4) * 1.8;    // 轻微摆动
  const sway  = Math.sin(crank) * 3;

  /* 车轮 */
  const deg = (state.wheel * 180) / Math.PI;
  rearSpokes.setAttribute("transform",  `translate(${REAR_HUB.x} ${REAR_HUB.y}) rotate(${deg.toFixed(1)})`);
  frontSpokes.setAttribute("transform", `translate(${FRONT_HUB.x} ${FRONT_HUB.y}) rotate(${deg.toFixed(1)})`);

  /* 曲柄与踏板 */
  const pFar  = pedalPos(crank + Math.PI);
  const pNear = pedalPos(crank);
  crankFar.arm.setAttribute("x2", pFar.x);   crankFar.arm.setAttribute("y2", pFar.y);
  crankFar.pad.setAttribute("x", pFar.x - 15);  crankFar.pad.setAttribute("y", pFar.y - 3);
  crankNear.arm.setAttribute("x2", pNear.x); crankNear.arm.setAttribute("y2", pNear.y);
  crankNear.pad.setAttribute("x", pNear.x - 15); crankNear.pad.setAttribute("y", pNear.y - 3);

  /* 背景滚动 */
  const rp = state.road;
  for (const d of dashes) {
    let x = d.__x0;
    if (x === undefined) { x = d.__x0 = +d.getAttribute("x"); }
    d.setAttribute("x", (((x - rp) % DASH_SPAN) + DASH_SPAN) % DASH_SPAN - 200);
  }
  for (const p of props) {
    let x = p.__x0;
    if (x === undefined) { x = p.__x0 = p.x0; }
    p.node.setAttribute("transform",
      `translate(${(((x - rp) % 1500) + 1500) % 1500 - 200} ${GROUND - 3}) scale(${p.scale})`);
  }
  for (const c of clouds) {
    const span = 1600;
    c.node.setAttribute("transform",
      `translate(${(((c.x0 - state.cloud * (1 + c.depth * 6)) % span) + span) % span - 200} ${c.y}) scale(${c.scale})`);
  }

  /* 投影 */
  shadow.setAttribute("cx", 575 + sway * 0.5);
  shadow.setAttribute("ry", 17 + bob * 0.8);

  /* 身体 */
  bodyG.setAttribute("transform",
    `translate(0 ${bob.toFixed(2)}) rotate(${lean.toFixed(2)} ${BODY_C.x} ${BODY_C.y})`);

  /* 眨眼 */
  let eyeSY = 1;
  if (state.blinkT >= 0) eyeSY = 1 - 0.93 * Math.sin(Math.PI * (state.blinkT / 0.16));
  eyeL.setAttribute("transform", `translate(414 236) scale(1 ${eyeSY.toFixed(3)})`);
  eyeR.setAttribute("transform", `translate(492 236) scale(1 ${eyeSY.toFixed(3)})`);

  /* ---- 触手 ---- */
  const wave = t => Math.sin(T * 2.4 + t);
  const wave2 = t => Math.sin(T * 1.7 + t * 1.4);

  // 1) 身后飘动的 4 条
  for (const a of trailArms) {
    const o = { x: a.o[0], y: a.o[1] + bob };
    const tip = { x: a.tip[0] + wave(a.ph) * 10, y: a.tip[1] + wave2(a.ph) * a.amp };
    const m1 = { x: lerp(o.x, tip.x, 0.34), y: lerp(o.y, tip.y, 0.34) + wave(a.ph + 1.1) * a.amp * 0.75 };
    const m2 = { x: lerp(o.x, tip.x, 0.68), y: lerp(o.y, tip.y, 0.68) + wave(a.ph + 2.2) * a.amp * 1.05 };
    updateTentacle(a.t, [o, m1, m2, tip]);
  }

  // 2) 后侧手臂（抓车把）
  {
    const o = { x: 500, y: 288 + bob };
    const tip = { x: 744, y: 292 + wave(3.1) * 1.5 };
    const m1 = { x: 606, y: 246 + bob + wave(2.0) * 4 };
    const m2 = { x: 690, y: 262 + wave(2.6) * 3 };
    updateTentacle(farArm.t, [o, m1, m2, tip]);
  }
  // 3) 后侧腿（远端踏板）
  {
    const o = { x: 428, y: 334 + bob };
    const { knee, foot } = twoBoneIK(o, pFar, 122, 122, -0.35);
    const m1 = { x: lerp(o.x, knee.x, 0.5) + wave(1.2) * 4, y: lerp(o.y, knee.y, 0.5) };
    const m2 = { x: lerp(knee.x, foot.x, 0.5) + wave(2.4) * 4, y: lerp(knee.y, foot.y, 0.5) };
    updateTentacle(farLeg.t, [o, m1, knee, m2, foot]);
  }

  // 4) 前侧手臂
  {
    const o = { x: 520, y: 302 + bob };
    const tip = { x: 757, y: 301 + wave(3.4) * 1.5 };
    const m1 = { x: 622, y: 254 + bob + wave(2.2) * 5 };
    const m2 = { x: 706, y: 274 + wave(2.8) * 3 };
    updateTentacle(nearArm.t, [o, m1, m2, tip]);
  }
  // 5) 前侧腿（近端踏板）
  {
    const o = { x: 472, y: 338 + bob };
    const { knee, foot } = twoBoneIK(o, pNear, 126, 126, -0.35);
    const m1 = { x: lerp(o.x, knee.x, 0.5) + wave(1.7) * 5, y: lerp(o.y, knee.y, 0.5) };
    const m2 = { x: lerp(knee.x, foot.x, 0.5) + wave(2.9) * 5, y: lerp(knee.y, foot.y, 0.5) };
    updateTentacle(nearLeg.t, [o, m1, knee, m2, foot]);
  }

  // 6) 围巾
  {
    const o = { x: 424, y: 266 + bob * 0.8 };
    const tip = { x: 148, y: 202 + wave2(0.5) * 22 };
    const m1 = { x: 330, y: 224 + wave(0.9) * 18 };
    const m2 = { x: 242, y: 232 + wave(1.8) * 22 };
    updateTentacle(scarfT, [o, m1, m2, tip]);
  }

  /* 气泡 */
  for (const b of bubbles) {
    b.node.setAttribute("cx", b.x.toFixed(1));
    b.node.setAttribute("cy", b.y.toFixed(1));
    b.node.setAttribute("r", b.r.toFixed(1));
    b.node.setAttribute("opacity", clamp(b.life, 0, 1) * 0.4);
  }
}

/* =========================================================
   7. 主循环 / 交互
   ========================================================= */
const btnPlay  = document.getElementById("btnPlay");
const rngSpeed = document.getElementById("rngSpeed");
const lblSpeed = document.getElementById("lblSpeed");

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);
  if (!state.paused) step(dt * state.speed);
  render();
  requestAnimationFrame(loop);
}

/* 静态快照模式：?t=1.5 冻结在指定时刻，便于截图检查 */
const FIXED_T = parseFloat(new URLSearchParams(location.search).get("t"));
if (!Number.isNaN(FIXED_T)) {
  const h = 1 / 60;
  for (let i = 0, k = Math.round(FIXED_T / h); i < k; i++) step(h);
  render();
} else {
  requestAnimationFrame(loop);
}

function setPaused(p) {
  state.paused = p;
  btnPlay.textContent = p ? "▶" : "⏸";
  if (!p) last = performance.now();
}
btnPlay.addEventListener("click", () => setPaused(!state.paused));
rngSpeed.addEventListener("input", () => {
  state.speed = +rngSpeed.value;
  lblSpeed.textContent = state.speed.toFixed(1) + "×";
});
document.getElementById("stage").addEventListener("click", () => setPaused(!state.paused));
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); setPaused(!state.paused); }
});
</script>
